plugins {
    // 26.1 起插件 id 从 'fabric-loom' 改为 'net.fabricmc.fabric-loom'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version      = project.mod_version
group        = project.maven_group
base.archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"

loom {
    // 26.1 起没有 intermediary 命名空间（MC 本身不再混淆）
    noIntermediateMappings()
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.1 起不要写 mappings / yarn_mappings，写了会报 "were not built for Minecraft version 26.2"

    // 26.1 起 modImplementation / modCompileOnly -> implementation / compileOnly
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "minecraft_version": project.minecraft_version,
               "loader_version": project.loader_version,
               "java_version": project.java_version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    // 26.1 起不要 withSourcesJar()：无 intermediary，remapSourcesJar 无法工作
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

// 26.1 起产物用 jar 任务，不再有 remapJar
jar {
    from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}
