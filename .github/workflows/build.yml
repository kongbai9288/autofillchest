name: Build AutoFillChest

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-autofillchest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: 解析最新 Loom 版本
        run: |
          mkdir -p logs
          {
            curl -sSL https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml \
              | grep -o '<version>[^<]*</version>' | tail -1 | sed 's/<\/*version>//g' > /tmp/loom.txt
            LOOM=$(cat /tmp/loom.txt)
            echo "resolved loom=$LOOM"
            if [ -n "$LOOM" ]; then
              sed -i "s/^loom_version=.*/loom_version=$LOOM/" gradle.properties
            else
              echo "解析失败，保留 gradle.properties 里的原值"
            fi
          } 2>&1 | tee logs/resolve-loom.log

      - name: 准备 Gradle 9.7.0
        run: |
          mkdir -p logs
          {
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.0-bin.zip
            mkdir -p "$RUNNER_TEMP/gdist"
            unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP/gdist"
            echo "$RUNNER_TEMP/gdist/gradle-9.7.0/bin" >> $GITHUB_PATH
            "$RUNNER_TEMP/gdist/gradle-9.7.0/bin/gradle" --version
          } 2>&1 | tee logs/prepare-gradle.log

      - name: 构建
        id: gradle
        continue-on-error: true
        run: gradle build --no-daemon --stacktrace 2>&1 | tee logs/build.log

      - name: 收集结果
        if: always()
        run: |
          mkdir -p build-out
          if ls build/libs/*.jar >/dev/null 2>&1; then
            cp build/libs/*.jar build-out/
            echo "BUILD_OK=true" >> $GITHUB_ENV
            ls -la build-out/
          else
            echo "BUILD_OK=false" >> $GITHUB_ENV
            echo "没有产出 jar"
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autofillchest-out
          path: build-out/
          retention-days: 7

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          retention-days: 7

      - name: 提交结果到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A logs/ build-out/
          if git diff --staged --quiet; then
            echo "无变化"
          else
            git commit -m "build: autofillchest (ok=$BUILD_OK)"
            git push
          fi
