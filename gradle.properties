# ===== Minecraft 26.2（Chaos Cubed）版本矩阵 =====
# 26.1 起官方发布未混淆版本，不再有 mappings / yarn_mappings，Loom 1.17 默认使用 Mojang 官方映射
java_version=25

minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT
# 0.155.2+26.2 也可用；这里取更新的 0.160.0+26.2
fabric_api_version=0.160.0+26.2

# ===== Mod 元数据 =====
mod_version=1.0.0
maven_group=com.kongbai
archives_base_name=autofillchest

# ===== Gradle =====
# 注意：Loom 1.17 的 Gradle 变体要求 plugin-api-version 9.7.0。
# 这里按需求写 9.5.1；若构建报 "Gradle version ... plugin-api-version" 不匹配，
# 把下面两处与 gradle/wrapper/gradle-wrapper.properties 一起改成 9.7.0 即可。
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
